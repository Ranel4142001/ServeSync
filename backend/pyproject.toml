[tool.poetry]
name = "backend"
version = "1.0.0"
description = "Python FastAPI Backend for ServeSync Helpdesk"
authors = ["ServeSync Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = "^2.0.28"
alembic = "^1.13.1"
pydantic = {extras = ["email"], version = "^2.6.4"}
pydantic-settings = "^2.2.1"
python-socketio = {extras = ["asgi"], version = "^5.11.1"}
pyjwt = "^2.8.0"
bcrypt = "^4.1.2"
psycopg2-binary = "^2.9.9"
uuid6 = "^2024.1.12"
google-generativeai = "^0.4.1"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
ruff = "^0.3.3"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
